# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "3.0.4"
  python_check_max: "3.14"

package:
  name: pydot
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pydot/pydot-${{ version }}.tar.gz
  sha256: 3ce88b2558f3808b0376f22bfa6c263909e1c3981e2a7b629b65b451eee4a25d

build:
  noarch: python
  number: 1
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61.0
  run:
    - graphviz >=2.38.0
    - pyparsing >=3.0.9
    - python >=${{ python_min }}

tests:
  - python:
      imports: pydot
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - test/
    requirements:
      run:
        - chardet
        - parameterized
        - pytest-cov
        # this branch is specifically interested in whether new 3.14(t) works
        - python ${{ python_check_max }}.*
        - python-freethreading
    script:
      - coverage run --source=pydot --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=69

about:
  license: MIT
  license_file:
    - LICENSES/MIT.txt
    - LICENSES/Python-2.0.txt
  summary: Python interface to Graphviz's Dot
  homepage: https://pypi.org/project/pydot
  repository: https://github.com/pydot/pydot

extra:
  recipe-maintainers:
    - nehaljwani
    - leycec
    - bollwyvl
